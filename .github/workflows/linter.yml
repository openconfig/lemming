name: Lint Code Base

on:
  push:
    branches: [main]
    # Remove the line above to run when pushing to master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: github/super-linter/slim@b807e99ddd37e444d189cfd2c2ca1274d8ae8ef1 # v7
        env:
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JSCPD: false
          VALIDATE_GO: false
          VALIDATE_CLANG_FORMAT: false
          VALIDATE_KUBERNETES_KUBEVAL: false
          VALIDATE_CHECKOV: false
          VALIDATE_GITLEAKS: false
          IGNORE_GENERATED_FILES: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER_REGEX_EXCLUDE: (Dockerfile.*dockerignore|dataplane/standalone/sai|configs/bullseye) # Linter thinks these are docker files but they aren't.
