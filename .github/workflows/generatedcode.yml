name: Check Generate Code
on:
  pull_request:
permissions:
  contents: read
jobs:
  gazelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4 # 0.14.0
      - name: Run Gazelle
        run: bazel run //:gazelle
      - name: Check Diff
        run: |
          if test -n "$(git status --porcelain)"; then
            # MODULE.bazel.lock file can change due to rules_python dependency packages.
            git diff HEAD -- ':(exclude)MODULE.bazel.lock'
            exit 1
          fi
  protos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4 # 0.14.0
      - name: Cache Bazel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'WORKSPACE', 'repositories.bzl') }}
          restore-keys: |
            ${{ runner.os }}-bazel-
      - name: Generate Protos
        run: tools/genproto.sh
      - name: Check Diff
        run: |
          if test -n "$(git status --porcelain)"; then
            # MODULE.bazel.lock file can change due to rules_python dependency packages.
            git diff HEAD -- ':(exclude)MODULE.bazel.lock'
            exit 1
          fi
